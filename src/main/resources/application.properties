spring.application.name=picpay

# Configuração do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/picpay
spring.datasource.username=postgres
spring.datasource.password=dev123456

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuração do Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=picpay-desafio-backend
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Desserialização JSON
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.herlon.picpay.domain.entity
spring.kafka.consumer.properties[spring.json.value.default.type]=com.herlon.picpay.domain.entity.Transaction
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.cpfValidation.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.cpfValidation.sliding-window-size=10
resilience4j.circuitbreaker.instances.cpfValidation.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.cpfValidation.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cpfValidation.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.cpfValidation.permitted-number-of-calls-in-half-open-state=3